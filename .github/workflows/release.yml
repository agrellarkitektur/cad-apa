# Bygger programmet och lägger en färdig zip för webbhotellet på varje release.
#
# Så används den (sedan 0.12.5.4): ingenting behöver göras. Vid varje push
# till main läses versionen i package.json; finns ingen release v<version>
# skapas taggen och releasen på den commiten, med titel och text ur README:s
# avsnitt för versionen (scripts/release-notes.sh), och zip-filen läggs på
# den. Höj alltså versionen när versionen är klar, inte i början. En pushad
# tagg v* gör samma sak för just den taggen. En release som görs för hand under
# Releases på GitHub fungerar som förut. Efter någon minut ligger
# cad-apa-v0.12.5.4.zip under Assets på releasen. Den kan också köras för hand
# under Actions → "Bygg för webbhotellet" → "Run workflow"; då hamnar zip-filen
# under körningens Artifacts i stället.

name: Bygg för webbhotellet

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Vilken tagg som ska byggas: en ny version på main, den pushade taggen
  # eller releasens. Tomt = inget att göra (versionen har redan en release).
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            TAG="v$(node -p "require('./package.json').version")"
            gh release view "$TAG" >/dev/null 2>&1 && TAG=""
          else TAG="${GITHUB_REF_NAME:-manuell}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera
        run: npm ci

      - name: Typer och tester
        run: npx tsc --noEmit && npx vitest run

      - name: Bygg dist
        run: npm run build

      - name: Packa zip
        id: zip
        run: |
          NAME="cad-apa-$TAG"
          NAME="${NAME//\//-}"
          # Zip-filen innehåller en mapp som heter cad-apa, färdig att lägga
          # på webbhotellet så att adressen blir …/cad-apa/.
          mkdir -p package
          cp -r dist package/cad-apa
          cat > package/cad-apa/LASMIG.txt <<TXT
          cad-apa ${TAG}

          Ladda upp mappen cad-apa till webbhotellet, till exempel bredvid
          index.html för din webbplats. Programmet finns sedan på
          https://din-domän.se/cad-apa/

          Vill du behålla en äldre version: döp om den gamla mappen på servern
          först (till exempel cad-apa-0.6.1) innan du laddar upp den nya.

          Steg för steg: https://github.com/${GITHUB_REPOSITORY}#publicera-på-webbhotellet
          TXT
          (cd package && zip -r -9 "../$NAME.zip" cad-apa)
          echo "file=$NAME.zip" >> "$GITHUB_OUTPUT"

      - name: Skapa releasen ur README
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          scripts/release-notes.sh "$V" text > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$(scripts/release-notes.sh "$V" titel)" --notes-file release-notes.md

      - name: Lägg zip-filen på releasen
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.zip.outputs.file }}" --clobber

      - name: Spara zip-filen på körningen
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cad-apa-webbhotell
          path: ${{ steps.zip.outputs.file }}
